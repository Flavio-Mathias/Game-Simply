<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9f0df">
  <title>Princesa em Missão</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #233b32;
      --paper: #f8f5e9;
      --leaf: #448b5e;
      --berry: #da6555;
      --gold: #f4b966;
      --line: #c9d8c3;
      font-family: ui-monospace, "Cascadia Code", monospace;
      background: #d9f0df;
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      background-color: #d9f0df;
      background-image: radial-gradient(#badbc0 0.8px, transparent 0.8px);
      background-size: 18px 18px;
      overscroll-behavior: none;
    }
    button { color: inherit; font: inherit; }
    button:focus-visible { outline: 3px solid #2b6fd6; outline-offset: 2px; }
    .game {
      width: min(1080px, calc(100% - 36px));
      min-height: 100svh;
      margin: 0 auto;
      padding: 19px 0 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }
    .masthead, .controls, .control-group { display: flex; align-items: center; }
    .masthead { justify-content: space-between; gap: 12px; }
    .title-lockup { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .mark {
      width: 43px; height: 43px; flex: 0 0 43px;
      display: grid; place-items: center;
      border: 2px solid var(--ink); border-radius: 13px 13px 5px 5px;
      background: var(--gold); box-shadow: 3px 3px 0 var(--ink);
      font: 26px Georgia, serif;
    }
    h1 { margin: 0; font: 700 clamp(17px, 3vw, 23px)/1.08 Georgia, serif; }
    .subtitle { margin: 4px 0 0; color: #587261; font-size: 10px; }
    .top-actions { display: flex; gap: 8px; }
    .icon-button {
      width: 42px; height: 42px; padding: 0; display: grid; place-items: center;
      border: 2px solid var(--ink); border-radius: 8px; background: var(--paper);
      box-shadow: 2px 2px 0 var(--ink); cursor: pointer; font-size: 18px;
      touch-action: manipulation;
    }
    .icon-button:active, .pad-button:active, .pad-button.down { transform: translate(2px, 2px); box-shadow: none; }
    .status {
      min-height: 43px; padding: 7px 13px; gap: 6px 16px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      border: 2px solid var(--ink); border-radius: 7px;
      background: var(--paper); box-shadow: 3px 3px 0 var(--ink);
      font-size: 11px; font-weight: 800;
    }
    .stat { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .stat-value { color: #477c55; font-variant-numeric: tabular-nums; }
    .stat-value.warn { color: var(--berry); }
    .screen {
      position: relative; width: 100%; aspect-ratio: 1.75;
      overflow: hidden; border: 3px solid var(--ink); border-radius: 9px;
      background: #5c94fc; box-shadow: 5px 5px 0 var(--ink);
      isolation: isolate; touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
    .overlay {
      position: absolute; inset: 0; display: grid; place-items: center;
      padding: 18px; background: #19392d99; backdrop-filter: blur(3px);
    }
    .overlay[hidden] { display: none; }
    .dialog {
      width: min(380px, 100%); max-height: 100%; overflow: auto; padding: 20px 19px 18px; text-align: center;
      border: 3px solid var(--ink); border-radius: 9px;
      background: var(--paper); box-shadow: 5px 5px 0 #1e392b;
    }
    .dialog-icon { margin: 0 0 5px; font: 34px/1 Georgia, serif; }
    .dialog h2 { margin: 0 0 8px; font: 700 23px/1.1 Georgia, serif; }
    .dialog p { margin: 0 auto 15px; max-width: 34ch; color: #4b6a56; font-size: 11px; line-height: 1.6; white-space: pre-line; }
    .play-again {
      min-height: 43px; padding: 0 17px; border: 2px solid var(--ink);
      border-radius: 6px; background: var(--gold); box-shadow: 2px 2px 0 var(--ink);
      cursor: pointer; font-weight: 900; font-size: 12px;
    }
    .controls { justify-content: space-between; gap: 12px; }
    .control-group { gap: 8px; }
    .control-caption { color: #55745f; font-size: 9px; font-weight: 900; }
    .pad-button {
      width: 52px; height: 46px; padding: 0; display: grid; place-items: center;
      border: 2px solid var(--ink); border-radius: 7px; background: var(--paper);
      box-shadow: 2px 2px 0 var(--ink); cursor: pointer; font-size: 19px;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .pad-button.wide { width: 84px; font-size: 11px; font-weight: 900; }
    .pad-button.jump { background: var(--gold); }
    .pad-button.run { background: #f2a38f; }
    .credit { margin: 0; color: #587261; font: 11px Georgia, serif; text-align: center; }
    .credit kbd { padding: 1px 5px; border: 1px solid #9fb6a2; border-radius: 4px; background: var(--paper); font: 10px ui-monospace, monospace; }
    @media (max-width: 560px) {
      .game { width: calc(100% - 22px); padding: max(10px, env(safe-area-inset-top)) 0 max(10px, env(safe-area-inset-bottom)); gap: 10px; }
      .screen { aspect-ratio: 1.5; }
      .status { gap: 4px 10px; padding: 6px 9px; font-size: 10px; }
      .mark { width: 37px; height: 37px; flex-basis: 37px; font-size: 22px; }
      .icon-button { width: 39px; height: 39px; }
      .subtitle { max-width: 27ch; line-height: 1.4; }
      .control-caption { display: none; }
      .pad-button { width: 54px; height: 52px; }
      .pad-button.wide { width: 80px; }
      .credit { font-size: 10px; }
      .credit .kbd-hint { display: none; }
    }
    @media (max-height: 620px) and (min-width: 561px) {
      .game { padding-top: 9px; padding-bottom: 9px; gap: 7px; }
      .screen { aspect-ratio: 2; }
      .mark { width: 35px; height: 35px; flex-basis: 35px; }
      .pad-button { height: 38px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <main class="game" aria-label="Jogo Princesa em Missão">
    <header class="masthead">
      <div class="title-lockup">
        <div class="mark" aria-hidden="true">♕</div>
        <div>
          <h1>Princesa em Missão</h1>
          <p class="subtitle" id="chapter-name">O príncipe foi levado. Quem vai buscá-lo?</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="sound-button" type="button" aria-label="Som ligado" title="Som (M)">♪</button>
        <button class="icon-button" id="pause-button" type="button" aria-label="Pausar" title="Pausar (P)">Ⅱ</button>
        <button class="icon-button" id="restart-button" type="button" aria-label="Recomeçar a fase" title="Recomeçar a fase (R)">↻</button>
      </div>
    </header>

    <div class="status" aria-label="Painel">
      <div class="stat">FASE <span id="stage-count" class="stat-value">1 / 5</span></div>
      <div class="stat" aria-live="polite" title="Flores-chave">✿ <span id="key-count" class="stat-value">0 / 3</span></div>
      <div class="stat" title="Moedas">● <span id="coin-count" class="stat-value">00</span></div>
      <div class="stat">PONTOS <span id="score-count" class="stat-value">000000</span></div>
      <div class="stat">TEMPO <span id="time-count" class="stat-value">300</span></div>
      <div class="stat" aria-label="Vidas">♥ <span id="life-count" class="stat-value">5</span></div>
    </div>

    <section class="screen" id="screen" aria-label="Área do jogo">
      <canvas id="game-canvas" aria-label="Aurora correndo e pulando pelas fases para salvar o príncipe Theo"></canvas>
      <div class="overlay" id="overlay" hidden>
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
          <p class="dialog-icon" id="dialog-icon" aria-hidden="true">♕</p>
          <h2 id="dialog-title">Uma aventura começa</h2>
          <p id="dialog-copy">A princesa já está a caminho.</p>
          <button class="play-again" id="play-again" type="button">Começar aventura</button>
        </div>
      </div>
    </section>

    <nav class="controls" aria-label="Controles do jogo">
      <div class="control-group">
        <span class="control-caption">MOVER</span>
        <button class="pad-button" type="button" data-control="left" aria-label="Mover para a esquerda" title="Mover para a esquerda">←</button>
        <button class="pad-button" type="button" data-control="right" aria-label="Mover para a direita" title="Mover para a direita">→</button>
      </div>
      <div class="control-group">
        <button class="pad-button wide run" type="button" data-control="run" aria-label="Correr e lançar fogo" title="Correr / fogo">B · CORRER</button>
        <button class="pad-button wide jump" type="button" data-control="jump" aria-label="Pular" title="Pular">A · PULAR</button>
      </div>
    </nav>
    <p class="credit"><span class="kbd-hint"><kbd>←</kbd> <kbd>→</kbd> mover · <kbd>Espaço</kbd> pular · <kbd>Shift</kbd> correr e lançar fogo · <kbd>P</kbd> pausa · <kbd>M</kbd> som</span></p>
  </main>

  <script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const canvas = $('#game-canvas');
const ctx = canvas.getContext('2d');
const screenEl = $('#screen');
const overlay = $('#overlay');
const T = 16, ROWS = 12, VIEW_H = T * ROWS;
let VIEW_W = 336, SCALE = 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const approach = (v, t, d) => (v < t ? Math.min(t, v + d) : Math.max(t, v - d));
const rand = (a, b) => a + Math.random() * (b - a);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const store = {
  get(k, d) { try { const v = localStorage.getItem('princesa.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('princesa.' + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- áudio (WebAudio sintetizado) ----------
const Snd = (() => {
  let ac = null, master = null, sfxBus = null, musBus = null, muted = store.get('muted', false);

  const TRACKS = {
    map: { d: 0.2, lead: 'C5 . E5 . G5 . E5 . | F5 . A5 . C6 . A5 . | G5 . B5 . D6 . B5 . | C6 - - - . . . .', bass: 'C3 . G3 . C3 . G3 . | F3 . C3 . F3 . C3 . | G3 . D3 . G3 . D3 . | C3 . G3 . C3 . . .' },
    forest: { d: 0.17,
      lead: 'E5 . G5 . E5 . C5 . | D5 . F5 . D5 . B4 . | C5 . E5 . G5 . C6 . | B5 . G5 . D5 - - . | A5 . A5 . G5 . E5 . | F5 . F5 . E5 . D5 . | E5 . G5 . A5 . G5 . | E5 - D5 - C5 - - .',
      bass: 'C3 . G3 . C3 . G3 . | G2 . D3 . G2 . D3 . | C3 . G3 . C3 . G3 . | G2 . D3 . G2 . G2 . | F2 . C3 . F2 . C3 . | D3 . A2 . D3 . A2 . | C3 . G2 . C3 . E3 . | G2 . G2 . C3 . C3 .' },
    sky: { d: 0.2,
      lead: 'F5 . A5 . C6 . A5 . | G5 . Bb5 . D6 . Bb5 . | A5 . C6 . F6 . C6 . | Bb5 . A5 . G5 - F5 - | C6 . . C6 D6 . C6 . | Bb5 . . Bb5 C6 . Bb5 . | A5 . G5 . F5 . G5 . | A5 - - - C5 - - .',
      bass: 'F3 . . C3 . . F3 . | G3 . . D3 . . G3 . | A3 . . E3 . . A3 . | Bb2 . . C3 . . C3 . | F3 . . C3 . . F3 . | G3 . . D3 . . G3 . | A3 . . E3 . . A3 . | Bb2 . . C3 . . C3 .' },
    mines: { d: 0.2,
      lead: 'A4 . . C5 . E5 . . | D5 . . B4 . G4 . . | A4 . . C5 . E5 . A5 | G5 . E5 . D5 . . . | E5 . . . D5 . C5 . | B4 . . . A4 . . . | C5 . . E5 . G5 . . | F5 . E5 . D5 . E5 .',
      bass: 'A2 . A2 . E3 . A2 . | G2 . G2 . D3 . G2 . | F2 . F2 . C3 . F2 . | E2 . E2 . B2 . E2 . | A2 . A2 . E3 . A2 . | G2 . G2 . D3 . G2 . | F2 . F2 . C3 . F2 . | E2 . E2 . B2 . E2 .' },
    mountain: { d: 0.15,
      lead: 'D5 . F#5 . A5 . F#5 . | E5 . G5 . B5 . G5 . | F#5 . A5 . D6 . A5 . | G5 . F#5 . E5 - D5 . | A5 . A5 F#5 . D5 . F#5 | G5 . G5 E5 . C#5 . E5 | F#5 . A5 . B5 . A5 . | F#5 - E5 - D5 - - .',
      bass: 'D3 . A3 . D3 . A3 . | E3 . B3 . E3 . B3 . | F#3 . C#3 . F#3 . C#3 . | G3 . A3 . D3 . D3 . | D3 . A3 . D3 . A3 . | E3 . B3 . E3 . B3 . | F#3 . C#3 . F#3 . C#3 . | G3 . A3 . D3 . D3 .' },
    castle: { d: 0.16,
      lead: 'E5 . E5 . F5 . E5 . | D5 . C5 . B4 . . . | E5 . E5 . G5 . F5 . | E5 . D5 . E5 - - . | B5 . A5 . G5 . F5 . | E5 . F5 . G5 . A5 . | B5 . C6 . B5 . A5 . | G5 . F5 . E5 - - .',
      bass: 'E2 . E2 . E2 . E2 . | C3 . C3 . B2 . B2 . | E2 . E2 . E2 . E2 . | F2 . F2 . E2 . E2 . | E2 . E2 . E2 . E2 . | C3 . C3 . B2 . B2 . | E2 . E2 . E2 . E2 . | F2 . F2 . E2 . E2 .' },
  };
  TRACKS.boss = { ...TRACKS.castle, d: 0.12 };
  function ensure() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ac = new AC(); } catch (e) { return false; }
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.7; master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.55; sfxBus.connect(master);
    musBus = ac.createGain(); musBus.gain.value = 0.2; musBus.connect(master);
    return true;
  }
  function tone(f, dur, o = {}) {
    if (!ac || !f) return;
    const { type = 'square', vol = 0.18, slide = 0, delay = 0, bus = sfxBus } = o;

  function noise(dur, vol = 0.2, delay = 0) {

    const n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);

    const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = buf; g.gain.value = vol;
    s.connect(g); g.connect(sfxBus); s.start(ac.currentTime + delay);
  }
  const arp = (notes, gap, o) => notes.forEach((n, i) => tone(freq(n), gap * 1.6, { ...o, delay: i * gap }));
  const SFX = {
    jump() { tone(300, 0.2, { slide: 700, vol: 0.14 }); },
    coin() { tone(988, 0.07); tone(1319, 0.28, { delay: 0.07 }); },
    stomp() { tone(260, 0.1, { slide: 90 }); noise(0.05, 0.15); },
    kick() { tone(180, 0.1, { slide: 360, type: 'triangle', vol: 0.3 }); },
    bump() { tone(110, 0.1, { type: 'triangle', vol: 0.35 }); },
    brick() { noise(0.2, 0.3); tone(140, 0.12, { type: 'triangle' }); },
    sprout() { tone(380, 0.35, { slide: 900, type: 'triangle', vol: 0.25 }); },
    power() { arp(['C5', 'E5', 'G5', 'C6', 'E6', 'G6'], 0.06, { vol: 0.14 }); },
    fire() { tone(800, 0.09, { slide: 300, vol: 0.12 }); },
    hurt() { tone(700, 0.4, { slide: 120, vol: 0.2 }); },
    oneup() { arp(['E5', 'G5', 'E6', 'C6', 'D6', 'G6'], 0.07, { vol: 0.14 }); },
    key() { arp(['A5', 'E6', 'A6'], 0.07, { type: 'triangle', vol: 0.22 }); },
    hit() { noise(0.2, 0.3); tone(160, 0.3, { slide: 60, vol: 0.3 }); },
    boom() { noise(0.6, 0.35); tone(120, 0.6, { slide: 40, type: 'sawtooth', vol: 0.3 }); },
    flame() { noise(0.3, 0.15); tone(200, 0.3, { slide: 90, type: 'sawtooth', vol: 0.12 }); },
    tick() { tone(880, 0.06, { vol: 0.12 }); },
    die() { arp(['B4', 'F5', 'B4', 'F4', 'E4', 'D4', 'C4'], 0.12, { vol: 0.16, type: 'triangle' }); },
    clear() { arp(['C5', 'E5', 'G5', 'C6', 'G5', 'C6', 'E6', 'G6', 'C7'], 0.09, { vol: 0.15 }); },
    win() { arp(['C5', 'C5', 'C5', 'G5', 'E5', 'G5', 'C6', 'E6', 'G6', 'C7'], 0.12, { vol: 0.15 }); },
    gameover() { arp(['G4', 'E4', 'C4', 'G3'], 0.25, { type: 'triangle', vol: 0.25 }); },
    select() { tone(660, 0.07, { vol: 0.1 }); },
  };
  function parse(str) {
    const toks = str.replace(/\|/g, ' ').trim().split(/\s+/), steps = new Array(toks.length).fill(null); let last = null;

  }

    if (!track || !ac) return;

      const i = step % track.n, l = track.lead[i], b = track.bass[i], d = track.d;

      if (b) tone(b.f, b.len * d * 0.9, { type: 'triangle', vol: 0.9, bus: musBus, delay: nextT - ac.currentTime });
      nextT += d; step++;
    }
  }
  return {
    unlock: ensure,
    get muted() { return muted; },
    sfx(name) { if (muted || !ensure()) return; SFX[name] && SFX[name](); },
    music(name) {

      this.stop(); trackName = name;
      if (!ensure() || !TRACKS[name]) return;
      const t = TRACKS[name], lead = parse(t.lead), bass = parse(t.bass);

    },
    stop() { if (timer) clearInterval(timer); timer = null; track = null; trackName = ''; },

    resume() { if (ac && ac.state === 'suspended') ac.resume(); },

  };
})();
// ---------- arte procedural em pixels ----------
const K = '#2a2030';
function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; fn(g, w, h); return c; }

function ell(g, c, cx, cy, rx, ry) { g.fillStyle = c; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function poly(g, c, pts) { g.fillStyle = c; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fill(); }
function crisp(c) { const g = c.getContext('2d'), d = g.getImageData(0, 0, c.width, c.height); for (let i = 3; i < d.data.length; i += 4) d.data[i] = d.data[i] > 110 ? 255 : 0; g.putImageData(d, 0, 0); return c; }
function outline(c, col = K) {
  const g = c.getContext('2d'), w = c.width, h = c.height, d = g.getImageData(0, 0, w, h), a = d.data, o = new Uint8ClampedArray(a);
  const rgb = [parseInt(col.slice(1, 3), 16), parseInt(col.slice(3, 5), 16), parseInt(col.slice(5, 7), 16)];
  const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && a[(y * w + x) * 4 + 3] > 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;

function createLevel(w, themeName) {
  const map = Array.from({ length: ROWS }, () => Array(w).fill(' '));
  const L = { w, themeName, map, content: {}, ents: [], keys: [], lifts: [], mids: [], midRows: [], goal: null, arena: null };
  const set = (x, y, c) => { if (x >= 0 && x < w && y >= 0 && y < ROWS) map[y][x] = c; };
  const B = {
    L, set,
    ground(a, b) { for (let x = a; x <= b; x++) { set(x, 10, 'G'); set(x, 11, 'D'); } },
    gap(a, b) { for (let x = a; x <= b; x++) { set(x, 10, ' '); set(x, 11, ' '); } },
    isle(a, b, row) { for (let x = a; x <= b; x++) { set(x, row, 'G'); if (row + 1 < ROWS) set(x, row + 1, 'D'); } },
    hill(a, b, h) { for (let x = a; x <= b; x++) for (let y = 10 - h; y <= 10; y++) set(x, y, y === 10 - h ? 'G' : 'D'); },
    ceil(a, b, n) { for (let x = a; x <= b; x++) for (let y = 0; y < n; y++) set(x, y, 'D'); },
    lava(a, b) { for (let x = a; x <= b; x++) { set(x, 10, 'V'); set(x, 11, 'V'); } },
    spikes(a, b, base = 10) { for (let x = a; x <= b; x++) set(x, base - 1, 'X'); },
    plat(a, b, row) { for (let x = a; x <= b; x++) set(x, row, '='); },
    pipe(x, h, base = 10, plant = false) {
      const top = base - h;
      set(x, top, 'T'); set(x + 1, top, 't');
      for (let y = top + 1; y < base; y++) { set(x, y, 'L'); set(x + 1, y, 'l'); }
      if (plant) B.en('plant', x, top, { pipeTop: top * T });
    },
    row(x, y, spec) {
      [...spec].forEach((ch, i) => {
        const tx = x + i;
        if (ch === 'B') set(tx, y, 'B');
        else if (ch === 'S') set(tx, y, 'S');
        else if (ch === 'c') set(tx, y, 'o');
        else if (ch === '?') { set(tx, y, 'Q'); L.content[tx + ',' + y] = 'coin'; }
        else if (ch === 'P') { set(tx, y, 'Q'); L.content[tx + ',' + y] = 'power'; }
        else if (ch === '1') { set(tx, y, 'Q'); L.content[tx + ',' + y] = '1up'; }
      });
    },
    coins(x, y, n) { for (let i = 0; i < n; i++) set(x + i, y, 'o'); },
    arc(x, y, n) { for (let i = 0; i < n; i++) set(x + i, y + Math.round(Math.pow(2 * i / (n - 1) - 1, 2) * 1.6), 'o'); },
    stairsUp(x, h, base = 10) { for (let i = 0; i < h; i++) for (let y = base - 1 - i; y < base; y++) set(x + i, y, 'S'); },
    stairsDown(x, h, base = 10) { for (let i = 0; i < h; i++) for (let y = base - h + i; y < base; y++) set(x + i, y, 'S'); },
    wall(x, y0, y1) { for (let y = y0; y <= y1; y++) set(x, y, 'S'); },
    en(type, x, by = 10, o = {}) { L.ents.push({ type, x: x * T + T / 2, by: by * T, ...o }); },
    key(x, y) { L.keys.push({ x: x * T + 8, y: y * T + 8 }); },
    lift(x, y, axis, range, speed) { L.lifts.push({ x: x * T, y: y * T, w: 32, h: 8, axis, min: axis === 'x' ? x * T : y * T, max: (axis === 'x' ? x : y) * T + range * T, speed, dir: 1, dx: 0, dy: 0 }); },
    mid(x, row = 10) { L.mids.push(x * T); L.midRows.push(row); },
    goal(x) { L.goal = x * T; },
  };
  return B;
}

const SOLID = 'GDBQUSTtLl#';
const tile = (tx, ty) => (tx < 0 || tx >= lvl.w) ? '#' : (ty < 0 || ty >= ROWS) ? ' ' : lvl.map[ty][tx];
const solid = ch => ch !== ' ' && SOLID.includes(ch);
function moveX(b, dx) {
  b.x += dx;
  const t0 = Math.floor(b.y / T), t1 = Math.floor((b.y + b.h - 0.01) / T);
  if (dx > 0) { const tx = Math.floor((b.x + b.w - 0.001) / T); for (let ty = t0; ty <= t1; ty++) if (solid(tile(tx, ty))) { b.x = tx * T - b.w; return true; } }
  else if (dx < 0) { const tx = Math.floor(b.x / T); for (let ty = t0; ty <= t1; ty++) if (solid(tile(tx, ty))) { b.x = (tx + 1) * T; return true; } }
  return false;
}
function moveY(b, dy) {
  const prevBottom = b.y + b.h; b.y += dy; b.onGround = false;
  const l = Math.floor(b.x / T), r = Math.floor((b.x + b.w - 0.001) / T), res = { landed: false, head: null };
  if (dy >= 0) {
    const ty = Math.floor((b.y + b.h) / T);
    for (let tx = l; tx <= r; tx++) { const ch = tile(tx, ty); if (solid(ch) || (ch === '=' && prevBottom <= ty * T + 0.5)) { b.y = ty * T - b.h; b.vy = 0; b.onGround = true; res.landed = true; break; } }
  } else {
    const ty = Math.floor(b.y / T); let best = 0, bt = -1;
    for (let tx = l; tx <= r; tx++) if (solid(tile(tx, ty))) { const ov = Math.min(b.x + b.w, (tx + 1) * T) - Math.max(b.x, tx * T); if (ov > best) { best = ov; bt = tx; } }
    if (bt >= 0) { b.y = (ty + 1) * T; b.vy = 0; res.head = { tx: bt, ty }; }
  }
  return res;
}

function updatePlayer(dt) {

  p.prevBottom = p.y + p.h;
